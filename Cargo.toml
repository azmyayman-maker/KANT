[workspace]
resolver = "2"
members = [
    "crates/kant-core",
    "crates/kant-lexer",
    "crates/kant-parser",
    "crates/kant-canonical",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["The Kant Project Architects"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kant-lang/kant"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
pretty_assertions = "1.4"
