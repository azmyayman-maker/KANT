name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build kantc (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: kantc
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: kantc
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            bin_name: kantc
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: kantc.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --bin kantc --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          DIST_DIR="dist/kantc-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$DIST_DIR"
          strip "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" || true
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$DIST_DIR/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$DIST_DIR/"
          tar -czf "kantc-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C dist "kantc-${{ github.ref_name }}-${{ matrix.target }}"
          shasum -a 256 "kantc-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" > "kantc-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256"

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $DIST_DIR = "dist/kantc-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $DIST_DIR | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination $DIST_DIR
          Copy-Item "README.md", "LICENSE-MIT", "LICENSE-APACHE" -Destination $DIST_DIR
          Compress-Archive -Path "$DIST_DIR/*" -DestinationPath "kantc-${{ github.ref_name }}-${{ matrix.target }}.zip"
          $hash = (Get-FileHash -Path "kantc-${{ github.ref_name }}-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  kantc-${{ github.ref_name }}-${{ matrix.target }}.zip" | Out-File -Encoding utf8 "kantc-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256"

      - name: Upload artifact archive
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            kantc-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish-release:
    name: Consolidate & Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: package-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd release-artifacts
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt
